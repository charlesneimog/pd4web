name: pd4web-compiler
on:
    workflow_dispatch:
        inputs:
            publish_pypi:
                description: "Publish built wheels to PyPI"
                required: false
                default: false
                type: boolean
            publish_pdobject:
                description: "Publish PureData Object"
                required: false
                default: false
                type: boolean

env:
    BUILD_TYPE: Release
    SCCACHE_DIR: ~/.cache/sccache
    LIBNAME: pd4web
    LIBVERSION: "3.3.1"

jobs:
    pd4web-compiler:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                    - os: macos-26-intel
                      macos_architecture: x86_64
                      pd_cpu: amd64
                      macos_deployment_target: "10.15"
                    - os: macos-latest
                      macos_architecture: arm64
                      pd_cpu: arm64
                      macos_deployment_target: "11.0"
                    - os: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            # Cache build deps and compiler caches
            - name: Cache CMake and dependencies
              id: build-cache
              uses: actions/cache@v5
              with:
                  path: |
                      build/_deps
                      ~/.ccache
                      ~/.cache/sccache
                  key: build-cv22-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '**/pyproject.toml') }}
                  restore-keys: |
                      build-cv22-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-
                      build-cv22-${{ matrix.os }}-${{ runner.arch }}-
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install NASM (Windows)
              if: runner.os == 'Windows'
              uses: ilammy/setup-nasm@v1

            - name: Install Perl and Ninja (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  choco install strawberryperl -y
                  choco install ninja -y
            - name: Install sccache (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/mozilla/sccache/releases/latest"
                  $asset = $release.assets | Where-Object { $_.name -match 'x86_64-pc-windows-msvc\.zip$' } | Select-Object -First 1
                  if (-not $asset) { throw "sccache Windows asset not found" }
                  $zipPath = Join-Path $env:TEMP "sccache.zip"
                  Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
                  $dest = Join-Path $env:LocalAppData "sccache-bin"
                  if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
                  Expand-Archive -LiteralPath $zipPath -DestinationPath $dest
                  $exe = Get-ChildItem $dest -Recurse -Filter "sccache.exe" | Select-Object -First 1
                  if (-not $exe) { throw "sccache.exe not found after install" }
                  Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
                  Write-Host "sccache installed at $($exe.FullName)"
            - name: Install PureData for Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  winget install -e --id MillerPuckette.PureData --accept-source-agreements --accept-package-agreements
                  # Remove-Item -Path build/pd.cmake -Force
            - name: Install PureData for macOS
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install --cask pd
                  brew install ccache
                  brew install git
                  brew install perl
            - name: Install PureData for Linux
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y software-properties-common ccache
                  sudo add-apt-repository ppa:pure-data/pure-data -y || true
                  sudo apt-get update
                  sudo apt-get install -y puredata
            - name: Configure ccache
              if: runner.os != 'Windows'
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z
            - name: Start sccache server (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  sccache --start-server
            - name: Configure compiler launcher
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  } else {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  }
            - name: Install Python Packages
              run: |
                  pip install build --break-system-packages
            - name: Set macOS deployment target
              if: startsWith(matrix.os, 'macos')
              run: |
                  echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
                  echo "CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
                  echo "CMAKE_OSX_ARCHITECTURES=${{ matrix.macos_architecture }}" >> "$GITHUB_ENV"
                  echo "CMAKE_ARGS=$CMAKE_ARGS -DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_architecture }}" >> "$GITHUB_ENV"
            - name: Build wheels
              run: |
                  python -c "import pathlib, shutil; pathlib.Path('build/CMakeCache.txt').unlink(missing_ok=True); pathlib.Path('build/pd.cmake').unlink(missing_ok=True); shutil.rmtree('build/CMakeFiles', ignore_errors=True)"
                  python -m pip install build --break-system-packages
                  python -m build --wheel
            - name: Verify macOS PureData object architecture
              if: startsWith(matrix.os, 'macos')
              shell: bash
              run: |
                  object="build/Sources/Pd/pd4web.compiler.darwin-${{ matrix.pd_cpu }}-32.so"
                  if [[ ! -f "$object" ]]; then
                      echo "Expected PureData object was not built: $object" >&2
                      find build/Sources/Pd -maxdepth 1 -type f -name 'pd4web.compiler.darwin-*.so' -print
                      exit 1
                  fi

                  unexpected="$(find build/Sources/Pd -maxdepth 1 -type f -name 'pd4web.compiler.darwin-*.so' ! -name "$(basename "$object")" -print)"
                  if [[ -n "$unexpected" ]]; then
                      echo "Unexpected PureData object(s) were built:" >&2
                      echo "$unexpected" >&2
                      exit 1
                  fi

                  object_architectures="$(lipo -archs "$object")"
                  if [[ "$object_architectures" != "${{ matrix.macos_architecture }}" ]]; then
                      echo "Expected $object to contain only ${{ matrix.macos_architecture }}, got: $object_architectures" >&2
                      exit 1
                  fi
            - name: Show ccache stats (macOS/Linux)
              if: runner.os != 'Windows'
              run: ccache -s

            - name: Show sccache stats (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: sccache --show-stats

            - name: Repair Linux wheels
              if: ${{ github.event.inputs.publish_pypi == 'true' && runner.os == 'Linux' }}
              run: |
                  python -m pip install auditwheel
                  auditwheel repair dist/*.whl -w dist/
                  rm dist/*-linux_*.whl
            - name: Upload PureData Object
              uses: actions/upload-artifact@v7
              with:
                  name: pd4web-object-${{ matrix.os }}
                  path: GetNinjaBinary
                  if-no-files-found: error

            - name: Upload Python Module
              uses: actions/upload-artifact@v7
              with:
                  name: pypd4web-${{ matrix.os }}
                  path: dist/*.whl
                  if-no-files-found: error

    publish-pypi:
        if: ${{ github.event.inputs.publish_pypi == 'true' }}
        permissions:
            contents: write
        needs: pd4web-compiler
        runs-on: ubuntu-latest
        steps:
            - name: Download wheels
              uses: actions/download-artifact@v7
              with:
                  pattern: pypd4web-*
                  merge-multiple: true
                  path: dist

            - name: Download puredata
              uses: actions/download-artifact@v7
              with:
                  pattern: pd4web-object-*
                  merge-multiple: true
                  path: ${{ env.LIBNAME }}

            - name: Upload using docker deken
              continue-on-error: true
              if: ${{ github.event.inputs.publish_pdobject == 'true' }}
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  pip install deken
                  deken package --version ${{ env.LIBVERSION }} ${{ env.LIBNAME }}
                  deken upload -v ${{ env.LIBVERSION }} *.dek

            - name: Upload using docker deken
              if: ${{ github.event.inputs.publish_pdobject == 'true' }}
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  deken package --version ${{ env.LIBVERSION }} ${{ env.LIBNAME }}
                  deken upload -v ${{ env.LIBVERSION }} *.dek
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  skip-existing: true
                  packages-dir: dist

            - name: Create zip
              run: |
                  zip -r pd4web-${{ env.LIBVERSION }}.zip ${{ env.LIBNAME }}
            - name: Create / Update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.LIBVERSION }}
                  name: v${{ env.LIBVERSION }}
                  target_commitish: ${{ github.sha }}
                  draft: true
                  prerelease: false
                  files: |
                      pd4web-${{ env.LIBVERSION }}.zip
