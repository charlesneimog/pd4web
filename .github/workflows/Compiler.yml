name: pd4web-compiler
on:
    workflow_dispatch:
        inputs:
            publish_pypi:
                description: "Publish built wheels to PyPI"
                required: false
                default: false
                type: boolean
            publish_pdobject:
                description: "Publish PureData Object"
                required: false
                default: false
                type: boolean

concurrency:
    group: pd4web-compiler-${{ github.ref }}
    cancel-in-progress: true

env:
    BUILD_TYPE: Release
    LIBNAME: pd4web
    LIBVERSION: "3.3.0a1"

jobs:
    pd4web-compiler:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-26-intel, macos-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            # Cache build deps and compiler caches
            - name: Cache CMake and dependencies
              id: build-cache
              uses: actions/cache@v4
              with:
                  path: |
                      build/_deps
                      build/CMakeCache.txt
                      build/CMakeFiles
                      ~/.ccache
                  key: build-cv33-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '**/pyproject.toml') }}
                  restore-keys: |
                      build-cv33-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-
                      build-cv33-${{ matrix.os }}-${{ runner.arch }}-
            - uses: actions/setup-python@v5
              if: runner.os != 'Windows'
              with:
                  python-version: "3.11"

            - name: Install MinGW-w64 (Windows)
              if: runner.os == 'Windows'
              id: msys2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      make
                      perl
                      perl-Pod-Usage
                  pacboy: >-
                      toolchain:p
                      clang:p
                      ccache:p
                      cmake:p
                      nasm:p
                      ninja:p
                      python:p
                      python-pip:p
                      tree-sitter:p

            - name: Configure MinGW-w64 paths (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
                  $mingwBin = Join-Path $msys2Root 'mingw64\bin'
                  $msysBin = Join-Path $msys2Root 'usr\bin'
                  $cygpath = Join-Path $msysBin 'cygpath.exe'
                  $msys2RootPosix = (& $cygpath -u $msys2Root).Trim()
                  $perlLib = "$msys2RootPosix/usr/share/perl5/core_perl"
                  $mingwBinNormalized = $mingwBin.Replace('\', '/')
                  $msysBinNormalized = $msysBin.Replace('\', '/')

                  $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Append
                  "MINGW_BIN=$mingwBinNormalized" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "MSYS_BIN=$msysBinNormalized" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "PERL5LIB=$perlLib" | Out-File -FilePath $env:GITHUB_ENV -Append

                  $env:PATH = "$mingwBin;$msysBin;$env:PATH"
                  $env:PERL5LIB = $perlLib
                  & (Join-Path $msysBin 'perl.exe') -MPod::Usage -e 'print "Pod::Usage available at ", $INC{"Pod/Usage.pm"}, "\n"'
                  if ($LASTEXITCODE -ne 0) {
                      throw "MSYS2 Perl cannot load Pod::Usage from native Windows"
                  }
                  & (Join-Path $mingwBin 'clang.exe') --version
                  & (Join-Path $mingwBin 'clang++.exe') --version
                  & (Join-Path $mingwBin 'mingw32-make.exe') --version
                  & (Join-Path $msysBin 'make.exe') --version
                  & (Join-Path $mingwBin 'nasm.exe') -v

            - name: Install PureData for Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  winget install -e --id MillerPuckette.PureData --accept-source-agreements --accept-package-agreements
                  # Remove-Item -Path build/pd.cmake -Force
            - name: Install PureData for macOS
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install --cask pd
                  brew install ccache
                  brew install git
                  brew install perl
            - name: Install PureData for Linux
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y software-properties-common ccache
                  sudo add-apt-repository ppa:pure-data/pure-data -y || true
                  sudo apt-get update
                  sudo apt-get install -y puredata
            - name: Configure ccache
              if: runner.os != 'Windows'
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z
            - name: Configure ccache (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z
            - name: Configure compiler launcher
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                    "CC=$env:MINGW_BIN/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CXX=$env:MINGW_BIN/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER=$env:MINGW_BIN/clang.exe -DCMAKE_CXX_COMPILER=$env:MINGW_BIN/clang++.exe -DCMAKE_C_COMPILER_LAUNCHER=$env:MINGW_BIN/ccache.exe -DCMAKE_CXX_COMPILER_LAUNCHER=$env:MINGW_BIN/ccache.exe -DBUILD_SHARED_LIBS=OFF -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_USE_CCACHE=OFF -DOPENSSL_BUILD_VERBOSE=ON -DOPENSSL_ENABLE_PARALLEL=ON -DOPENSSL_CONFIGURE_TOOL=$env:MSYS_BIN/perl.exe -DTREE_SITTER_CLI=$env:MINGW_BIN/tree-sitter.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                  } else {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  }
            - name: Install Python Packages
              run: |
                  python -m pip install build --break-system-packages
            - name: Set macOS deployment target
              if: startsWith(matrix.os, 'macos')
              run: |
                  if [[ "${{ matrix.os }}" == "macos-26-intel" ]]; then
                      echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
                      echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
                  else
                      echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
                      echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
                  fi
            - name: Build wheels
              if: runner.os != 'Windows'
              run: |
                  python -c "import os; os.remove('./build/pd.cmake') if os.path.exists('./build/pd.cmake') else None"
                  python -m pip install build --break-system-packages
                  python -m build --wheel
            - name: Build wheels (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $env:PATH = "$env:MINGW_BIN;$env:MSYS_BIN;$env:PATH"
                  python -c "import os; os.remove('./build/pd.cmake') if os.path.exists('./build/pd.cmake') else None"
                  python -m pip install build --break-system-packages
                  python -m build --wheel --config-setting=wheel.py-api=
            - name: Show ccache stats (macOS/Linux)
              if: runner.os != 'Windows'
              run: ccache -s

            - name: Show ccache stats (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: ccache -s

            - name: Repair Linux wheels
              if: ${{ github.event.inputs.publish_pypi == 'true' && runner.os == 'Linux' }}
              run: |
                  python -m pip install auditwheel
                  auditwheel repair dist/*.whl -w dist/
                  rm dist/*-linux_*.whl
            - name: Upload PureData Object
              uses: actions/upload-artifact@v4
              with:
                  name: pd4web-object-${{ matrix.os }}
                  path: pd4web

            - name: Upload Python Module
              uses: actions/upload-artifact@v4
              with:
                  name: pypd4web-${{ matrix.os }}
                  path: dist/*.whl

    publish-pypi:
        if: ${{ github.event.inputs.publish_pypi == 'true' }}
        permissions:
            contents: write
        needs: pd4web-compiler
        runs-on: ubuntu-latest
        steps:
            - name: Download wheels
              uses: actions/download-artifact@v4
              with:
                  pattern: pypd4web-*
                  merge-multiple: true
                  path: dist

            - name: Download puredata
              uses: actions/download-artifact@v4
              with:
                  pattern: pd4web-object-*
                  merge-multiple: true
                  path: ${{ env.LIBNAME }}

            - name: Upload using docker deken
              if: ${{ github.event.inputs.publish_pdobject == 'true' }}
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  docker run --rm \
                    --user $(id -u) \
                    --volume $(pwd):/deken \
                    registry.git.iem.at/pd/deken \
                    deken package --version ${{ env.LIBVERSION }} ${{ env.LIBNAME }}
                  docker run --rm \
                    --user $(id -u) \
                    --volume $(pwd):/deken \
                    -e DEKEN_USERNAME -e DEKEN_PASSWORD \
                    registry.git.iem.at/pd/deken \
                    deken upload -v ${{ env.LIBVERSION }} *.dek
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  skip-existing: true
                  packages-dir: dist

            - name: Create zip
              run: |
                  zip -r pd4web-${{ env.LIBVERSION }}.zip ${{ env.LIBNAME }}
            - name: Create / Update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.LIBVERSION }}
                  name: v${{ env.LIBVERSION }}
                  target_commitish: ${{ github.sha }}
                  draft: true
                  prerelease: false
                  files: |
                      pd4web-${{ env.LIBVERSION }}.zip
