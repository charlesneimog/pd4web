name: pd4web-compiler
on:
    workflow_dispatch:
        inputs:
            publish_pypi:
                description: "Publish built wheels to PyPI"
                required: false
                default: false
                type: boolean
            publish_pdobject:
                description: "Publish PureData Object"
                required: false
                default: false
                type: boolean

env:
    BUILD_TYPE: Release
    LIBNAME: pd4web
    LIBVERSION: "3.3.0a1"

jobs:
    pd4web-compiler:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-26-intel, macos-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            # Cache build deps and compiler caches
            - name: Cache CMake and dependencies
              id: build-cache
              uses: actions/cache@v4
              with:
                  path: |
                      build/_deps
                      build/CMakeCache.txt
                      build/CMakeFiles
                      ~/.ccache
                  key: build-cv21-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '**/pyproject.toml') }}
                  restore-keys: |
                      build-cv21-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-
                      build-cv21-${{ matrix.os }}-${{ runner.arch }}-
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install MinGW-w64 (Windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  pacboy: >-
                      toolchain:p
                      ccache:p
                      cmake:p
                      ninja:p

            - name: Add MinGW-w64 to PATH (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Install NASM (Windows)
              if: runner.os == 'Windows'
              uses: ilammy/setup-nasm@v1

            - name: Install Perl (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  choco install strawberryperl -y
            - name: Install PureData for Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  winget install -e --id MillerPuckette.PureData --accept-source-agreements --accept-package-agreements
                  # Remove-Item -Path build/pd.cmake -Force
            - name: Install PureData for macOS
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install --cask pd
                  brew install ccache
                  brew install git
                  brew install perl
            - name: Install PureData for Linux
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y software-properties-common ccache
                  sudo add-apt-repository ppa:pure-data/pure-data -y || true
                  sudo apt-get update
                  sudo apt-get install -y puredata
            - name: Configure ccache
              if: runner.os != 'Windows'
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z
            - name: Configure ccache (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z
            - name: Configure compiler launcher
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                    "CC=C:/msys64/mingw64/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CXX=C:/msys64/mingw64/bin/g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER=C:/msys64/mingw64/bin/gcc.exe -DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe -DCMAKE_C_COMPILER_LAUNCHER=C:/msys64/mingw64/bin/ccache.exe -DCMAKE_CXX_COMPILER_LAUNCHER=C:/msys64/mingw64/bin/ccache.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
                  } else {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  }
            - name: Install Python Packages
              run: |
                  pip install build --break-system-packages
            - name: Set macOS deployment target
              if: startsWith(matrix.os, 'macos')
              run: |
                  if [[ "${{ matrix.os }}" == "macos-26-intel" ]]; then
                      echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
                      echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
                  else
                      echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
                      echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
                  fi
            - name: Build wheels
              run: |
                  python -c "import os; os.remove('./build/pd.cmake') if os.path.exists('./build/pd.cmake') else None"
                  python -m pip install build --break-system-packages
                  python -m build --wheel
            - name: Show ccache stats (macOS/Linux)
              if: runner.os != 'Windows'
              run: ccache -s

            - name: Show ccache stats (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: ccache -s

            - name: Repair Linux wheels
              if: ${{ github.event.inputs.publish_pypi == 'true' && runner.os == 'Linux' }}
              run: |
                  python -m pip install auditwheel
                  auditwheel repair dist/*.whl -w dist/
                  rm dist/*-linux_*.whl
            - name: Upload PureData Object
              uses: actions/upload-artifact@v4
              with:
                  name: pd4web-object-${{ matrix.os }}
                  path: pd4web

            - name: Upload Python Module
              uses: actions/upload-artifact@v4
              with:
                  name: pypd4web-${{ matrix.os }}
                  path: dist/*.whl

    publish-pypi:
        if: ${{ github.event.inputs.publish_pypi == 'true' }}
        permissions:
            contents: write
        needs: pd4web-compiler
        runs-on: ubuntu-latest
        steps:
            - name: Download wheels
              uses: actions/download-artifact@v4
              with:
                  pattern: pypd4web-*
                  merge-multiple: true
                  path: dist

            - name: Download puredata
              uses: actions/download-artifact@v4
              with:
                  pattern: pd4web-object-*
                  merge-multiple: true
                  path: ${{ env.LIBNAME }}

            - name: Upload using docker deken
              if: ${{ github.event.inputs.publish_pdobject == 'true' }}
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  docker run --rm \
                    --user $(id -u) \
                    --volume $(pwd):/deken \
                    registry.git.iem.at/pd/deken \
                    deken package --version ${{ env.LIBVERSION }} ${{ env.LIBNAME }}
                  docker run --rm \
                    --user $(id -u) \
                    --volume $(pwd):/deken \
                    -e DEKEN_USERNAME -e DEKEN_PASSWORD \
                    registry.git.iem.at/pd/deken \
                    deken upload -v ${{ env.LIBVERSION }} *.dek
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  skip-existing: true
                  packages-dir: dist

            - name: Create zip
              run: |
                  zip -r pd4web-${{ env.LIBVERSION }}.zip ${{ env.LIBNAME }}
            - name: Create / Update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.LIBVERSION }}
                  name: v${{ env.LIBVERSION }}
                  target_commitish: ${{ github.sha }}
                  draft: true
                  prerelease: false
                  files: |
                      pd4web-${{ env.LIBVERSION }}.zip
