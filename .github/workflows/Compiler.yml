name: pd4web release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: pd4web-release-${{ github.ref }}
    cancel-in-progress: false

env:
    BUILD_TYPE: Release
    SCCACHE_DIR: ~/.cache/sccache
    LIBNAME: pd4web

jobs:
    metadata:
        name: Release metadata
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - name: Get version from tag
              id: version
              shell: bash
              run: |
                  echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
                  echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.artifact }})
        needs: metadata
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact: linux-x86_64
                    - os: macos-26-intel
                      artifact: macos-x86_64
                      macos_architecture: x86_64
                      pd_cpu: amd64
                      macos_deployment_target: "10.15"
                    - os: macos-latest
                      artifact: macos-arm64
                      macos_architecture: arm64
                      pd_cpu: arm64
                      macos_deployment_target: "11.0"
                    - os: windows-latest
                      artifact: windows-x86_64

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Cache CMake dependencies and compiler caches
              uses: actions/cache@v5
              with:
                  path: |
                      build/_deps
                      ~/.ccache
                      ~/.cache/sccache
                  key: build-cv23-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', 'pyproject.toml') }}
                  restore-keys: |
                      build-cv23-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-
                      build-cv23-${{ matrix.os }}-${{ runner.arch }}-

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Set Python package version from tag
              shell: bash
              env:
                  RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
              run: |
                  python - <<'PYTHON'
                  import os
                  import pathlib
                  import re

                  path = pathlib.Path("pyproject.toml")
                  text = path.read_text(encoding="utf-8")
                  version = os.environ["RELEASE_VERSION"]
                  text, count = re.subn(
                      r'(?m)^version\s*=\s*"[^"]+"',
                      lambda _: f'version = "{version}"',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise RuntimeError("No project version found in pyproject.toml")
                  path.write_text(text, encoding="utf-8")

                  match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(.*)", version)
                  if match is None:
                      raise ValueError(f"Unsupported version tag: {version}")
                  major, minor, patch, suffix = match.groups()
                  header = pathlib.Path("Sources/Compiler/pd4web_compiler.hpp")
                  source = header.read_text(encoding="utf-8")
                  for part, value in (
                      ("MAJOR", major),
                      ("MINOR", minor),
                      ("PATCH", f'"{patch}{suffix}"'),
                  ):
                      source, count = re.subn(
                          rf"(?m)^#define PD4WEB_VERSION_{part} .+$",
                          lambda _: f"#define PD4WEB_VERSION_{part} {value}",
                          source,
                          count=1,
                      )
                      if count != 1:
                          raise RuntimeError(f"Missing PD4WEB_VERSION_{part}")
                  header.write_text(source, encoding="utf-8")
                  print(f"Building pd4web {version}")
                  PYTHON

            - name: Install NASM
              if: runner.os == 'Windows'
              uses: ilammy/setup-nasm@v1

            - name: Install Perl, Ninja, and sccache
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  choco install strawberryperl ninja -y
                  $ErrorActionPreference = "Stop"
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/mozilla/sccache/releases/latest"
                  $asset = $release.assets | Where-Object { $_.name -match 'x86_64-pc-windows-msvc\.zip$' } | Select-Object -First 1
                  if (-not $asset) { throw "sccache Windows asset not found" }
                  $zipPath = Join-Path $env:TEMP "sccache.zip"
                  Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
                  $dest = Join-Path $env:LocalAppData "sccache-bin"
                  if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
                  Expand-Archive -LiteralPath $zipPath -DestinationPath $dest
                  $exe = Get-ChildItem $dest -Recurse -Filter "sccache.exe" | Select-Object -First 1
                  if (-not $exe) { throw "sccache.exe not found after install" }
                  Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

            - name: Install Pure Data
              if: runner.os == 'Windows'
              shell: pwsh
              run: winget install -e --id MillerPuckette.PureData --accept-source-agreements --accept-package-agreements

            - name: Install Pure Data and build tools
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install --cask pd
                  brew install ccache git perl

            - name: Install Pure Data and build tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y software-properties-common ccache
                  sudo add-apt-repository ppa:pure-data/pure-data -y || true
                  sudo apt-get update
                  sudo apt-get install -y puredata

            - name: Configure ccache
              if: runner.os != 'Windows'
              run: |
                  ccache --set-config=max_size=500M
                  ccache --set-config=compression=true
                  ccache -z

            - name: Start sccache server
              if: runner.os == 'Windows'
              shell: pwsh
              run: sccache --start-server

            - name: Configure compiler launcher
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  } else {
                    "CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" | Out-File -FilePath $env:GITHUB_ENV -Append
                  }

            - name: Set macOS deployment target
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "${GITHUB_ENV}"
                  echo "CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "${GITHUB_ENV}"
                  echo "CMAKE_OSX_ARCHITECTURES=${{ matrix.macos_architecture }}" >> "${GITHUB_ENV}"
                  echo "CMAKE_ARGS=${CMAKE_ARGS} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_architecture }}" >> "${GITHUB_ENV}"

            - name: Build Python wheel and Pure Data object
              shell: bash
              run: |
                  if [[ "${RUNNER_OS}" == "Windows" ]]; then
                      export PATH="/c/Strawberry/perl/bin:${PATH}"
                      hash -r
                      command -v perl
                      perl -MLocale::Maketext::Simple -e 'print "Perl OK\n"'
                  fi

                  python -m pip install --upgrade pip build
                  python -c "import pathlib, shutil; pathlib.Path('build/CMakeCache.txt').unlink(missing_ok=True); pathlib.Path('build/pd.cmake').unlink(missing_ok=True); shutil.rmtree('build/CMakeFiles', ignore_errors=True)"
                  python -m build --wheel

            - name: Verify Pure Data package
              shell: bash
              run: |
                  test -d build/Sources/Pd/pd4web
                  compgen -G "build/Sources/Pd/pd4web/pd4web.compiler.*" > /dev/null

            - name: Verify macOS Pure Data object architecture
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  object="build/Sources/Pd/pd4web/pd4web.compiler.darwin-${{ matrix.pd_cpu }}-32.so"
                  if [[ ! -f "${object}" ]]; then
                    echo "Expected Pure Data object was not built: ${object}" >&2
                    find build/Sources/Pd/pd4web -maxdepth 1 -type f -name 'pd4web.compiler.darwin-*.so' -print
                    exit 1
                  fi
                  object_architectures="$(lipo -archs "${object}")"
                  if [[ "${object_architectures}" != "${{ matrix.macos_architecture }}" ]]; then
                    echo "Expected ${object} to contain only ${{ matrix.macos_architecture }}, got: ${object_architectures}" >&2
                    exit 1
                  fi

            - name: Repair Linux wheel
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  python -m pip install auditwheel
                  auditwheel repair dist/*.whl -w dist/repaired
                  rm dist/*-linux_*.whl
                  mv dist/repaired/*.whl dist/
                  rmdir dist/repaired

            - name: Show compiler cache statistics
              if: always()
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                    sccache --show-stats
                  } else {
                    ccache -s
                  }

            - name: Upload Pure Data package
              uses: actions/upload-artifact@v7
              with:
                  name: pd4web-object-${{ matrix.artifact }}
                  path: build/Sources/Pd/pd4web
                  if-no-files-found: error

            - name: Upload Python wheel
              uses: actions/upload-artifact@v7
              with:
                  name: pypd4web-${{ matrix.artifact }}
                  path: dist/*.whl
                  if-no-files-found: error

    publish:
        name: Publish release artifacts
        needs:
            - metadata
            - build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download Python wheels
              uses: actions/download-artifact@v7
              with:
                  pattern: pypd4web-*
                  merge-multiple: true
                  path: dist

            - name: Download Pure Data packages
              uses: actions/download-artifact@v7
              with:
                  pattern: pd4web-object-*
                  merge-multiple: true
                  path: pd4web

            - name: Validate downloaded artifacts
              shell: bash
              run: |
                  compgen -G "dist/*.whl" > /dev/null
                  compgen -G "pd4web/pd4web.compiler.*" > /dev/null
                  test -f pd4web/pd4web.pd

            - name: Package and publish Pure Data object to Deken
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              shell: bash
              run: |
                  python -m pip install deken
                  deken package --version "${{ needs.metadata.outputs.version }}" pd4web
                  deken upload -v "${{ needs.metadata.outputs.version }}" ./*.dek

            - name: Publish Python wheels to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  skip-existing: true
                  packages-dir: dist

            - name: Assemble GitHub release assets
              shell: bash
              run: |
                  mkdir -p release
                  cp dist/*.whl release/
                  if compgen -G "./*.dek" > /dev/null; then
                    cp ./*.dek release/
                  fi
                  zip -r "release/pd4web-${{ needs.metadata.outputs.version }}.zip" pd4web

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.metadata.outputs.tag }}
                  name: ${{ needs.metadata.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: release/*
